version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # O projeto usa Java 21 (LTS): nao trocar a versao do Java das imagens automaticamente
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
